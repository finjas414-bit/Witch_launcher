name: Release build

permissions:
  contents: write
  actions: write

concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    name: Release build
    timeout-minutes: 360
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
          - platform: 3
            platform_name: tvos
          - platform: 7
            platform_name: iossimulator
          - platform: 8
            platform_name: tvossimulator

    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout repository submodules
        shell: bash
        run: |
          set -o pipefail
          SUBMODULES="Natives/external/NG-GL4ES/3rdparty/SPIRV-Cross Natives/external/NG-GL4ES/3rdparty/glslang"
          for i in 1 2 3 4 5 6; do
            echo "::group::Submodule update attempt $i/6"
            if git -c protocol.version=2 submodule sync -- $SUBMODULES && \
               git -c protocol.version=2 submodule update --init --force --depth=1 $SUBMODULES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            for p in $SUBMODULES; do
              if [ -e "$p/.git" ] && ! git -C "$p" rev-parse --verify -q HEAD >/dev/null 2>&1; then
                rm -rf "$p"
                echo "Removed poisoned clone: $p"
              fi
            done
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java8
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install make wget ldid autoconf pkg-config
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake || true

      - name: Resolve env
        shell: bash
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${{ steps.setup-java8.outputs.path }}" >> "$GITHUB_ENV"
          echo "BOOTJDK=${{ steps.setup-java8.outputs.path }}/bin" >> "$GITHUB_ENV"
          echo "RUNNER=1" >> "$GITHUB_ENV"

      - name: Build for ${{ matrix.platform_name }}
        env:
          JAVA_HOME: ${{ steps.setup-java8.outputs.path }}
          BOOTJDK: ${{ steps.setup-java8.outputs.path }}/bin
        shell: bash
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:/usr/local/bin:$PATH
          export RUNNER=1
          export JRE_BUILD_MODE=download
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }}
            gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          else
            gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Witch-${{ matrix.platform_name }}-ipa
          path: artifacts/Witch-*-${{ matrix.platform_name }}.ipa
          if-no-files-found: ignore

      - name: Upload regular tipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Witch-${{ matrix.platform_name }}-tipa
          path: artifacts/Witch-*-${{ matrix.platform_name }}-trollstore.tipa
          if-no-files-found: ignore

      - name: Upload Witch.dSYM
        if: matrix.platform_name == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: Witch-dSYM
          path: artifacts/Witch.dSYM
          if-no-files-found: ignore

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Reset rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete release --cleanup-tag -y 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/release" 2>/dev/null || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Witch Launcher — Release
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            **/*.ipa
            **/*.tipa
